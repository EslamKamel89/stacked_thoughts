<div
  class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 w-full mx-auto my-4 p-4"
>
  <h2 class="text-lg font-bold">Leave A Comment</h2>
  <form action="{% url 'blog_detail' post.slug %}" method="POST">
    <!--prettier-ignore-->
    {% csrf_token %}
    {% for field in form %}
    <div class="form-control">
      <!--prettier-ignore-->
      {{ field.label_tag }}
      <div
        class="{% if field.errors %} border-2 rounded-lg border-red-500 {% endif %}"
      >
        {{ field }}
      </div>
      {% if field.errors %} {% for error in field.errors %}
      <p class="text-red-500 text-sm">{{ error }}</p>
      {% endfor %} {% endif %}
    </div>
    {% endfor %}
    <button
      class="text-white mt-5 bg-green-500 box-border border border-transparent hover:bg-green-500 focus:ring-4 focus:ring-green-500 shadow-xs font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none"
    >
      Submit
    </button>
  </form>
</div>
