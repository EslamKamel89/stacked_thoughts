<div
  class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 w-full mx-auto my-4 p-6"
>
  {% for comment in comments %}

  <div
    class="border-b border-gray-200 pb-4 mb-4 last:mb-0 last:pb-0 last:border-0"
  >
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-lg font-semibold text-gray-900">
        {{ comment.user_name }}
      </h3>
      <span class="text-xs text-gray-500"> {{ comment.created_at }} </span>
    </div>

    <p class="text-sm text-gray-500 mb-2">{{ comment.user_email }}</p>

    <p class="text-gray-700 leading-relaxed">{{ comment.content }}</p>
  </div>

  {% empty %}
  <div class="text-center text-gray-500 py-4">No comments yet.</div>
  {% endfor %}
</div>
