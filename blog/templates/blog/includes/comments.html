<div
  class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 w-full mx-auto my-4 p-4"
>
  <div>Add Comment</div>
  <form>
    {% for field in form %}
    <!--prettier-ignore-->
    <div class="form-control {% if field.errors %} text-red-500 {% endif %}">
      {{ field.label_tag }}
      {{ field }}
       <p class="!text-red-500 !text-sm mt-1">{{ field.errors }}</p>
    </div>
    {% endfor %}
    <button
      class="text-white mt-5 bg-green-500 box-border border border-transparent hover:bg-green-500 focus:ring-4 focus:ring-green-500 shadow-xs font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none"
    >
      Submit
    </button>
  </form>
</div>
