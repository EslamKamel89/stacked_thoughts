{% load static %}
<div
  class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 w-full mx-auto"
>
  <a href="{% url 'blog_detail' post.slug %}">
    <img
      src="{{ post.image.url }}"
      alt="{{ post.title }}"
      class="w-full h-56 object-cover hover:opacity-95 transition-opacity duration-300"
    />
  </a>

  <div class="p-6">
    <div class="w-full flex items-center justify-between mb-3">
      <a
        href="{% url 'blog_detail' post.slug %}"
        class="text-2xl font-bold text-gray-900 hover:text-blue-600 transition-colors duration-200"
      >
        {{ post.title }}
      </a>

      <button
        class="px-4 py-2 text-sm font-medium rounded-xl border border-gray-300 text-gray-700 bg-white hover:bg-gray-100 active:bg-gray-200 transition flex items-center space-x-2"
      >
        <i class="bi bi-bookmark-plus text-gray-600 text-lg"></i>
        <span>Read later</span>
      </button>
    </div>

    {% include 'blog/includes/author.html'%}

    <p class="text-gray-600 mt-3 leading-relaxed">{{ post.excerpt }}</p>
    <ul class="flex flex-wrap gap-2 mt-4">
      {% for tag in post.tags.all %}
      <li
        class="bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-xs font-medium"
      >
        {{ tag.caption }}
      </li>
      {% endfor %}
    </ul>
    {% if show_details %}
    <p class="mt-4 text-gray-700 text-sm leading-relaxed">
      {{ post.content|linebreaks }}
    </p>
    {% else %}
    <div class="mt-5">
      <a
        href="{% url 'blog_detail' post.slug %}"
        class="inline-block bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors duration-200"
      >
        Read More →
      </a>
    </div>
    {% endif %}
  </div>
</div>
